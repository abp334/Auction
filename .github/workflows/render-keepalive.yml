name: Render keep-alive

on:
  schedule:
    # Every 10 minutes — keeps Render Free tier awake (sleeps after ~15 min idle)
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 2

    steps:
      - name: Ping Render health endpoint
        run: |
          URL="${{ secrets.RENDER_HEALTH_URL }}"
          if [ -z "$URL" ]; then
            URL="https://auction-nsx0.onrender.com/health"
          fi

          echo "Pinging $URL"
          HTTP_CODE=$(curl -sS -o /tmp/health.json -w "%{http_code}" \
            --connect-timeout 20 \
            --max-time 45 \
            "$URL")

          echo "HTTP $HTTP_CODE"
          cat /tmp/health.json || true

          if [ "$HTTP_CODE" != "200" ]; then
            echo "Health check failed"
            exit 1
          fi
